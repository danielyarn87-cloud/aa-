# AA 스포츠 분석 회사 조직도
# 인원을 늘리려면 members 에 한 명을 추가하고 personas/ 에 지시문 파일을 하나 만들면 됩니다.
# 부서를 늘리려면 departments 에 항목을 추가하면 됩니다. 코드는 고칠 필요가 없습니다.

company:
  name: AA 스포츠 분석
  model: claude-sonnet-5-5        # 분석가 기본 모델 (사람마다 member.model 로 바꿀 수 있음)
  language: ko

# 투표·추천 규칙 (회사 전체 공통)
policy:
  consensus_share: 0.5      # 1위 선택지의 가중 득표율이 이 값을 넘어야 픽 확정, 아니면 관망
  value_threshold: 0.05     # 기대값(확률 x 배당 - 1)이 5% 이상이면 '가치 있음' 표시
  min_samples_for_weight: 30  # 이 경기 수 이상 채점된 뒤부터 성적으로 투표 비중 조정
  weight_bounds: [0.5, 2.0]   # 투표 비중 하한·상한

# 매일 자동 실행 (python -m aa worker). 순서: 끝난 경기 채점 → 예정 경기 수집 → 새 경기 분석
automation:
  run_at: ["06:00", "14:00"]    # 한국 시각. 하루 두 번 (GitHub 자동 실행은 .github/workflows/daily.yml 의 cron)
  collect_days: 7               # 오늘부터 일주일 뒤 경기까지 모은다
  analyze_within_hours: 168     # 킥오프가 일주일 안인 경기는 자세한 자료까지 모은다
  auto_analyze: false           # false: 6시·14시에는 경기 목록만 모으고(Claude 비용 없음), 분석은 사이트에서 고른 경기만
  max_analyses_per_day: 400     # 하루 분석 경기 수 상한 (Claude API 비용 관리, 경기당 호출 6회)
  leagues: [39, 140, 135, 78, 61, 2, 3, 848, 40, 88, 94, 203, 144, 179, 292, 293, 98, 99, 17, 253, 188]  # 자동으로 다룰 리그 (전체). 사이트의 '분석 요청'에서 기본 리그를 저장하면 그쪽(data/settings.json)이 우선
  light: false                  # true 면 모든 경기를 호출 절약 방식으로 (킥오프 48시간 밖 경기는 늘 절약 방식)

# 데이터 공급처. API 키는 여기 적지 말고 환경변수로 넣으세요 (API_FOOTBALL_KEY, ODDS_API_KEY).
data_sources:
  timezone: Asia/Seoul
  api_football:
    daily_limit: auto         # auto: 계정 요금제의 실제 하루 한도를 읽어 씀 (못 읽으면 100). 숫자로 적으면 그 숫자로 고정
    cache_hours: 6            # 같은 요청은 이 시간 동안 다시 부르지 않음
  odds_api:
    monthly_credits: 500      # 무료 플랜 월 500 크레딧 (요청 1회 = 시장 수 x 지역 수)
    regions: eu
    markets: h2h,totals
    cache_hours: 3
  leagues:                    # api_football_id: API-Football 리그 번호 / odds_key: The Odds API 종목 키 / group: 사이트에서 묶는 이름
    - {name: 프리미어리그, api_football_id: 39, season: 2026, odds_key: soccer_epl, group: 유럽 5대 리그}
    - {name: 라리가, api_football_id: 140, season: 2026, odds_key: soccer_spain_la_liga, group: 유럽 5대 리그}
    - {name: 세리에A, api_football_id: 135, season: 2026, odds_key: soccer_italy_serie_a, group: 유럽 5대 리그}
    - {name: 분데스리가, api_football_id: 78, season: 2026, odds_key: soccer_germany_bundesliga, group: 유럽 5대 리그}
    - {name: 리그1, api_football_id: 61, season: 2026, odds_key: soccer_france_ligue_one, group: 유럽 5대 리그}
    - {name: 챔피언스리그, api_football_id: 2, season: 2026, odds_key: soccer_uefa_champs_league, group: 유럽 대회}
    - {name: 유로파리그, api_football_id: 3, season: 2026, odds_key: soccer_uefa_europa_league, group: 유럽 대회}
    - {name: 컨퍼런스리그, api_football_id: 848, season: 2026, odds_key: soccer_uefa_europa_conference_league, group: 유럽 대회}
    - {name: 챔피언십, api_football_id: 40, season: 2026, odds_key: soccer_efl_champ, group: 유럽 기타 리그}
    - {name: 에레디비시, api_football_id: 88, season: 2026, odds_key: soccer_netherlands_eredivisie, group: 유럽 기타 리그}
    - {name: 프리메이라리가, api_football_id: 94, season: 2026, odds_key: soccer_portugal_primeira_liga, group: 유럽 기타 리그}
    - {name: 쉬페르리그, api_football_id: 203, season: 2026, odds_key: soccer_turkey_super_league, group: 유럽 기타 리그}
    - {name: 벨기에 프로리그, api_football_id: 144, season: 2026, odds_key: soccer_belgium_first_div, group: 유럽 기타 리그}
    - {name: 스코틀랜드 프리미어십, api_football_id: 179, season: 2026, odds_key: soccer_spl, group: 유럽 기타 리그}
    - {name: K리그1, api_football_id: 292, season: 2026, odds_key: soccer_korea_kleague1, group: 아시아}
    - {name: K리그2, api_football_id: 293, season: 2026, group: 아시아}            # 배당 API 에 없음 → 배당·이득·배팅 게임 제외
    - {name: J1리그, api_football_id: 98, season: 2026, odds_key: soccer_japan_j_league, group: 아시아}
    - {name: J2리그, api_football_id: 99, season: 2026, group: 아시아}             # 배당 API 에 없음
    - {name: AFC챔피언스리그 엘리트, api_football_id: 17, season: 2026, group: 아시아}  # 배당 API 에 없음 → 분석만
    - {name: MLS, api_football_id: 253, season: 2026, odds_key: soccer_usa_mls, group: 아메리카}
    - {name: A리그, api_football_id: 188, season: 2026, odds_key: soccer_australia_aleague, group: 아시아}   # 호주 A리그 (10월~5월)
  team_aliases:               # 두 API 의 팀 이름이 다를 때 맞춰 주는 표 (API-Football 이름: The Odds API 이름)
    Manchester City: Manchester City
    Manchester United: Manchester United
    Wolves: Wolverhampton Wanderers
    Nottingham Forest: Nottingham Forest
    Tottenham: Tottenham Hotspur
    Newcastle: Newcastle United
    Brighton: Brighton and Hove Albion
    West Ham: West Ham United
    Inter: Inter Milan
    Bayern München: Bayern Munich
    Paris Saint Germain: Paris Saint Germain

departments:
  - id: soccer
    name: 축구분석팀
    sport: soccer
    active: true
    markets: [1x2, over_under]
    over_under_line: 2.5

  # 야구 확장 시 active 를 true 로 바꾸고 분석가를 배치하세요.
  - id: baseball
    name: 야구분석팀
    sport: baseball
    active: false
    markets: [1x2, over_under]
    over_under_line: 8.5

  # 예시: 나중에 생길 수 있는 지원 부서 (분석 투표에는 참여하지 않음)
  # - id: data
  #   name: 데이터팀
  #   sport: null
  #   active: false

members:
  - id: kim_data
    name: 고광렬
    former_names: [김데이터]
    title: 퀀트 분석가
    department: soccer
    role: analyst          # analyst = 투표 참여 / lead = 최종 요약 작성(투표 참여 여부는 votes 로)
    persona: personas/kim_data.md
    color: "#2563eb"          # 화면에서 쓰는 이 사람의 색
    base_weight: 1.0
    active: true

  - id: park_field
    name: 고니
    former_names: [박현장]
    title: 스카우트 분석가
    department: soccer
    role: analyst
    persona: personas/park_field.md
    color: "#15803d"          # 화면에서 쓰는 이 사람의 색
    base_weight: 1.0
    active: true

  - id: lee_contra
    name: 아귀
    former_names: [이역발]
    title: 역발상 분석가
    department: soccer
    role: analyst
    persona: personas/lee_contra.md
    color: "#ea580c"          # 화면에서 쓰는 이 사람의 색
    sees_market: true         # 1차 분석부터 배당을 본다 (시장이 과하게 쏠린 곳을 찾는 역할). 나머지는 배당 없이 자료만 보고 먼저 판단
    base_weight: 1.0
    active: true

  - id: hogu
    name: 호구형
    title: 일반 팬 분석가 (비교용)
    department: soccer
    role: analyst
    votes: false              # 팀 결론 투표에는 들어가지 않는다. 분석·토론·배팅·인사평가는 똑같이 해서 3명과 실력 비교
    model: claude-haiku-5-5   # 싸고 빠른 모델 (다른 3명은 Sonnet 5.5)
    persona: personas/hogu.md
    color: "#9333ea"          # 화면에서 쓰는 이 사람의 색 (보라)
    base_weight: 1.0
    active: true

  # 인원 추가 예시: 팀장을 두면 투표 결과를 종합한 최종 코멘트를 씁니다.
