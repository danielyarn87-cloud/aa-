<style>
/* VOICE everyday: 매일 아침 펼쳐 보는 운세 지면, 짧게 읽고 하루를 시작한다
   IDEA 붉은 부적지와 만세력. 주홍 바탕에 먹선으로 그린 십이지 판, 고른 칸은 노란 부적색
   PICTURE 첫 화면의 십이지(또는 별자리) 원판. 칸을 누르면 그 띠가 노랗게 켜지고 오른쪽과 아래 운세가 바뀐다
   COLOUR 주홍 #b8312a 바탕이 주도, 먹 #1c1714와 흰 지면이 받치고, 부적 노랑 #f2c94c 이 고른 것과 행운을 표시
   TYPE 제목·한자 Song Myung, 본문 Noto Sans KR
   LAYOUT 노트북: 주홍 띠 왼쪽 원판, 오른쪽 띠 요약. 아래 흰 지면에 출생연도 4칸이 한 줄. 720px 2×2, 휴대폰은 원판, 요약, 카드 순 한 줄 */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#14100e);--ink:light-dark(#1c1714,#f1e9e2);--mute:light-dark(#6b5f58,#b3a59b);--line:light-dark(#e8dfd8,#30261f);--panel:light-dark(#faf6f2,#1d1714);--red:light-dark(#f7c948,#d9a92e);--red2:light-dark(#e9b22a,#c4941c);--ink-on:#2b1a04;--yel:#c8102e;--yink:#fff;--mark:light-dark(#b8312a,#ff8a7a)}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.65 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip}
a{color:inherit}
h1,h2,h3{font-family:"Song Myung","Noto Serif KR",serif;font-weight:400;line-height:1.1;letter-spacing:-.01em;margin:0;text-wrap:balance}
button{font:inherit}
.band{padding-block:clamp(24px,3.6vw,52px);padding-left:max(5vw,16px);padding-right:max(5vw,16px)}
.wrap{max-width:1240px;margin-inline:auto}
.top{background:var(--red2);color:var(--ink-on);padding:10px max(5vw,16px)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 18px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:"Song Myung",serif;font-size:24px}
.seal{display:grid;place-items:center;width:36px;height:36px;border:2px solid var(--yel);color:var(--yel);border-radius:4px;font-size:20px;line-height:1}
.tabs{display:flex;flex-wrap:wrap;gap:4px}
.tabs a{text-decoration:none;padding:8px 14px;border-radius:999px;font-weight:500;font-size:15px;min-height:40px;display:flex;align-items:center}
.tabs a:hover{background:rgb(255 255 255/.14)}
.tabs a.on{background:var(--yel);color:var(--yink)}
.tabs a small{font-size:13px;opacity:.75;margin-left:4px}
.hero{background:var(--red);color:var(--ink-on)}
.hero .wrap{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr) 300px;gap:clamp(20px,3.4vw,48px);align-items:center}
/* 오른쪽 광고 칸: 구글 애드센스·쿠팡 파트너스 300×250. 넓은 화면은 세 번째 열, 좁으면 요약 아래 한 줄 */
.adcol{display:flex;flex-direction:column;gap:16px;align-items:center}
.cp-ad{display:flex;flex-direction:column;align-items:center;gap:4px}.cp-ad[hidden]{display:none}
.cp-ad .cp-in{width:300px;max-width:100%;min-height:250px;background:#fff;border-radius:8px;overflow:hidden}
.cp-ad .cp-note{margin:0;max-width:300px;font-size:11px;line-height:1.4;text-align:center;opacity:.8}
.slot{width:300px;max-width:100%;height:250px;border:1px dashed rgb(43 26 4/.45);border-radius:8px;background:rgb(255 255 255/.35);display:grid;place-items:center;text-align:center;font-size:13px;line-height:1.5;color:rgb(43 26 4/.8)}
.wheel{width:100%;max-width:400px;aspect-ratio:1;margin-inline:auto}
.wheel svg{width:100%;height:100%;display:block;overflow:visible}
.seg{cursor:pointer;outline:none}
.seg path{fill:transparent;stroke:rgb(43 26 4/.55);stroke-width:1.5;transition:fill .35s ease}
.seg:hover path{fill:rgb(255 255 255/.35)}
.seg:focus-visible path{stroke:var(--yel);stroke-width:3}
.seg.on path{fill:var(--yel);stroke:var(--yel)}
.seg text{fill:var(--ink-on);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.seg.on text{fill:var(--yink)}
.seg .hj{font-family:"Song Myung",serif;font-size:26px}
.seg .ko{font-size:14px;font-weight:500}
.seg .st{font-size:15px;font-weight:700}
.hub{fill:var(--red2);stroke:var(--yel);stroke-width:2}
.hubt{fill:var(--ink-on);text-anchor:middle;dominant-baseline:central}
.hubt.big{font-family:"Song Myung",serif;fill:var(--yel)}
.days{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.day{border:1px solid rgb(43 26 4/.5);background:transparent;color:var(--ink-on);border-radius:999px;padding:6px 14px;font-size:14px;min-height:40px;cursor:pointer}
.day[aria-pressed=true]{background:var(--ink-on);color:#fff4d6;border-color:var(--ink-on);font-weight:700}
.day:focus-visible,.tabs a:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.date{font-size:15px;opacity:.92;margin:0 0 6px}
.name{font-size:clamp(40px,6vw,64px);line-height:1.05}
.name small{font-size:.42em;opacity:.85;margin-left:8px}
.sum{font-size:17px;margin:14px 0 0;max-width:36em}
.lucky{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.lucky span{background:rgb(255 255 255/.45);border:1px solid rgb(43 26 4/.28);border-radius:8px;padding:6px 12px;font-size:14px}
.lucky b{color:var(--yel);font-weight:700;margin-left:6px}
.rel{display:inline-block;background:var(--yel);color:var(--yink);font-weight:700;font-size:14px;border-radius:6px;padding:2px 10px;margin-top:10px}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(14px,2vw,24px)}
.card{border-top:3px solid var(--ink);padding-top:14px}
.card h3{font-size:30px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.card .gz{font-family:"Noto Sans KR",sans-serif;font-size:14px;color:var(--mute)}
.grade{display:flex;align-items:center;gap:8px;margin:8px 0 10px}
.badge{font-size:13px;font-weight:700;border-radius:4px;padding:2px 8px;border:1.5px solid var(--mark);color:var(--mark)}
.badge.g5{background:var(--mark);color:var(--bg)}
.badge.g2,.badge.g1{border-color:var(--mute);color:var(--mute)}
.dots{display:flex;gap:4px}
.dots i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--mark)}
.dots i.f{background:var(--mark)}
.card p{margin:0 0 4px;font-size:16px}
.grade .k{font-weight:700;font-size:15px;min-width:3.2em}
.card .grade+p+.grade{margin-top:14px}
.meter.big .lab{font-family:"Song Myung",serif;font-weight:400;font-size:24px}
.meter.big .track{height:14px;border-radius:7px}
.meter.big p{font-size:16px}
.meter:not(.big) .track i{background:var(--mute)}
.sec{margin-top:clamp(28px,4vw,48px)}
.sec>h2{font-size:clamp(26px,3vw,32px);margin-bottom:6px}
.note{color:var(--mute);font-size:14px;margin:0 0 16px}
.ad{border:1px dashed var(--line);border-radius:8px;min-height:96px;display:grid;place-items:center;color:var(--mute);font-size:13px;margin-top:clamp(28px,4vw,44px)}
.split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:clamp(20px,4vw,48px);align-items:start}
.total{font-size:17px;margin:0}
.meters{display:grid;gap:16px}
.meter .lab{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-weight:700}
.meter .lab span{font-weight:400;color:var(--mute);font-size:14px;white-space:nowrap}
.track{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin:6px 0}
.track i{display:block;height:100%;background:var(--mark);border-radius:5px}
.meter p{margin:0;font-size:15px}
.rank{list-style:none;margin:0;padding:0}
.rank li{break-inside:avoid}
.rank button{width:100%;display:grid;grid-template-columns:2.2em minmax(0,7em) minmax(0,1fr) 3em;align-items:center;gap:10px;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 4px;color:var(--ink);text-align:left;cursor:pointer;min-height:44px}
.rank button:hover{background:var(--panel)}
.rank button.on{background:var(--panel);font-weight:700}
.rank .n{font-family:"Song Myung",serif;font-size:22px;color:var(--mark)}
.rank .bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.rank .bar i{display:block;height:100%;background:var(--ink)}
.rank .sc{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.soon{max-width:40em}
.soon p{font-size:17px}
.foot{border-top:1px solid var(--line);color:var(--mute);font-size:14px}
.foot .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px}
@media(max-width:1100px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:761px){.noads .hero .wrap{grid-template-columns:minmax(0,380px) minmax(0,1fr)}}
@media(max-width:1199px){.hero .wrap{grid-template-columns:minmax(0,380px) minmax(0,1fr)}.adcol{grid-column:1/-1;flex-direction:row;flex-wrap:wrap;justify-content:center}}
@media(max-width:760px){.hero .wrap,.split{grid-template-columns:minmax(0,1fr)}.wheel{max-width:340px}}
@media(max-width:600px){.cards{grid-template-columns:minmax(0,1fr)}.top .wrap{justify-content:center}}
@media(prefers-reduced-motion:reduce){.seg path{transition:none}}
</style>
</head>

/* 한국 시간 기준 날짜와 일진 */
function kstDay(offset) {
  const d = new Date(Date.now() + 9 * 3600e3 + offset * 864e5);
  const y = d.getUTCFullYear(), m = d.getUTCMonth() + 1, dd = d.getUTCDate();
  const a = Math.floor((14 - m) / 12), yy = y + 4800 - a, mm = m + 12 * a - 3;
  const jdn = dd + Math.floor((153 * mm + 2) / 5) + 365 * yy + Math.floor(yy / 4) - Math.floor(yy / 100) + Math.floor(yy / 400) - 32045;
  const gz = (jdn + 49) % 60;
  return {y, m, dd, key: `${y}-${m}-${dd}`, iso: `${y}-${String(m).padStart(2, '0')}-${String(dd).padStart(2, '0')}`, wd: '일월화수목금토'[d.getUTCDay()], gz, stem: gz % 10, branch: gz % 12};
}

const SIX = [[0,1],[2,11],[3,10],[4,9],[5,8],[6,7]];
const TRI = [[8,0,4],[11,3,7],[2,6,10],[5,9,1]];
function relation(b, day) {
  const dn = gzName(day.gz) + '일';
  if (b === day.branch) return {base: 3.1, tag: '같은 기운', text: `${dn}은 ${ANIMAL[b]}띠와 같은 기운의 날이라, 내 페이스대로 가면 무난합니다.`};
  if (SIX.some(p => p.includes(b) && p.includes(day.branch))) return {base: 3.7, tag: '육합(六合)', text: `${dn}과 육합을 이루어 사람 복이 따르는 날입니다.`};
  if (TRI.some(t => t.includes(b) && t.includes(day.branch))) return {base: 3.5, tag: '삼합(三合)', text: `${dn}과 삼합으로 기운이 모여 일이 한 방향으로 풀립니다.`};

  return {base: 3.1, tag: '', text: `${dn}과 큰 부딪힘이 없어 평소 흐름대로 이어집니다.`};
}

function ddiFortune(b, day) {
  const rel = relation(b, day);
  const r0 = rng(day.key + '|ddi|' + b);
  const lucky = {color: pick(r0, COLORS), num: [1 + Math.floor(r0() * 9), 1 + Math.floor(r0() * 9)], dir: pick(r0, DIRS), time: pick(r0, SIJIN)};
  if (lucky.num[0] === lucky.num[1]) lucky.num[1] = lucky.num[1] % 9 + 1;
  const years = [0, 1, 2, 3].map(k => {
    /* 20세 이상, 띠마다 4개: 올해-67 ~ 올해-20년생. 해가 바뀌면 자동으로 1년씩 올라감 */
    const minY = day.y - 67, y = minY + ((b - (minY - 4) % 12) % 12 + 12) % 12 + 12 * k, r = rng(day.key + '|y|' + y);
    const gm = clamp(rel.base + (r() - 0.5) * 2.6), gl = clamp(rel.base + (r() - 0.5) * 2.6);
    const old = day.y - y, age = old <= 29 ? 'young' : old <= 49 ? 'middle' : 'senior';
    const money = pick(r, MONEY_OPEN[gm]) + ' ' + pick(r, MID.money[tone(gm)]);
    const luck = pick(r, MID.luck[tone(gl)]) + ' ' + pick(r, ADV[age]);
    return {y, gm, gl, money, luck};
  });
  return {rel, lucky, years};
}

function starFortune(i, day) {
  const r = rng(day.key + '|star|' + i);
  const sc = CATS.map(() => clamp(2.3 + r() * 2.9));
  const avg = sc.reduce((a, b) => a + b, 0) / 4;
  const g = clamp(avg);
  const lines = [
    pick(r, MONEY_OPEN[sc[0]]) + ' ' + pick(r, MID.money[tone(sc[0])]),
    pick(r, MID.luck[tone(sc[1])]) + ' ' + pick(r, STAR_ADV),
    pick(r, MID.love[tone(sc[2])]),
    pick(r, MID.health[tone(sc[3])])];
  const text = [pick(r, OPEN[g]), pick(r, ELEM[STARS[i][2]])].join(' ');
  /* 순위는 금전운 + 행운운 (10점 만점) */
  return {sc, total: sc[0] + sc[1], g, text, lines, lucky: {color: pick(r, COLORS), num: 1 + Math.floor(r() * 9), item: pick(r, ITEMS), time: pick(r, SIJIN)}};

function wheel(items, sel, center, label) {
  const C = 200, R1 = 192, R0 = 86, rad = a => (a - 90) * Math.PI / 180;
  const pt = (r, a) => `${(C + r * Math.cos(rad(a))).toFixed(1)},${(C + r * Math.sin(rad(a))).toFixed(1)}`;
  const segs = items.map((it, i) => {
    const a0 = i * 30 - 15, a1 = a0 + 30, mid = i * 30;
    const d = `M${pt(R0, a0)} L${pt(R1, a0)} A${R1},${R1} 0 0 1 ${pt(R1, a1)} L${pt(R0, a1)} A${R0},${R0} 0 0 0 ${pt(R0, a0)}Z`;
    const [x1, y1] = pt(it.sub ? 160 : 140, mid).split(','), [x2, y2] = pt(118, mid).split(',');
    return `<g class="seg${i === sel ? ' on' : ''}" data-i="${i}" role="radio" tabindex="${i === sel ? 0 : -1}" aria-checked="${i === sel}" aria-label="${it.aria}"><path d="${d}"/>
      ${it.sub ? `<text class="hj" x="${x1}" y="${y1}">${it.top}</text><text class="ko" x="${x2}" y="${y2}">${it.sub}</text>` : `<text class="st" x="${x1}" y="${y1}">${it.top}</text>`}</g>`;
  }).join('');
  return `<div class="wheel"><svg viewBox="0 0 400 400" role="radiogroup" aria-label="${label}">${segs}
    <circle class="hub" cx="200" cy="200" r="${R0 - 8}"/>
    <text class="hubt big" x="200" y="186" font-size="${center[0].length > 1 ? 34 : 52}">${center[0]}</text>
    <text class="hubt" x="200" y="236" font-size="16">${center[1]}</text></svg></div>`;
}
function bindWheel(onPick) {
  const segs = [...view.querySelectorAll('.seg')];
  segs.forEach(s => {
    s.addEventListener('click', () => onPick(+s.dataset.i, false));
    s.addEventListener('keydown', e => {
      const i = +s.dataset.i;
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); onPick((i + 1) % 12, true); }
      else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); onPick((i + 11) % 12, true); }
      else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onPick(i, true); }
    });
  });
}

const SERVER = {};
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const clean = v => typeof v === 'string' ? esc(v) : Array.isArray(v) ? v.map(clean) : v && typeof v === 'object' ? Object.fromEntries(Object.entries(v).map(([k, x]) => [k, clean(x)])) : typeof v === 'number' ? v : '';
const num = (v, d) => Number.isFinite(+v) ? +v : d;
function ensure(day) {
  if (day.iso in SERVER) return;
  SERVER[day.iso] = null;
  fetch('/fortune/data/' + day.iso + '.json', {cache: 'no-cache'}).then(r => r.ok ? r.json() : null).then(j => {
    if (j && j.date === day.iso) { SERVER[day.iso] = clean(j); if (kstDay(offset).iso === day.iso) route(); }
  }).catch(() => {});
}
function ddiFrom(sv, fb) {
  const L = sv.lucky || {};
  return {
    rel: {tag: sv.relation_tag || fb.rel.tag, text: [sv.relation_text || fb.rel.text, sv.summary].filter(Boolean).join(' ')},
    lucky: {time: Array.isArray(L.time) && L.time.length === 2 ? L.time : fb.lucky.time, color: L.color || fb.lucky.color, num: Array.isArray(L.num) && L.num.length ? L.num : fb.lucky.num, dir: L.dir || fb.lucky.dir},
    years: fb.years.map(fy => { const y = (sv.years || []).find(x => num(x.y) === fy.y); return y && y.money && y.luck ? {y: fy.y, gm: clamp(num(y.gm, fy.gm)), gl: clamp(num(y.gl, fy.gl)), money: y.money, luck: y.luck} : fy; })};
}
function starOf(j, day) {
  const fb = starFortune(j, day), sv = SERVER[day.iso]?.stars?.[j];
  if (!sv || !Array.isArray(sv.lines) || sv.lines.length !== 4 || !Array.isArray(sv.sc) || sv.sc.length !== 4) return fb;
  const sc = sv.sc.map((x, k) => clamp(num(x, fb.sc[k]))), L = sv.lucky || {};
  return {sc, total: sc[0] + sc[1], g: clamp(num(sv.g, fb.g)), text: sv.text || fb.text, lines: sv.lines,
    lucky: {time: Array.isArray(L.time) && L.time.length === 2 ? L.time : fb.lucky.time, color: L.color || fb.lucky.color, num: L.num?.[0] ?? fb.lucky.num, item: L.item || fb.lucky.item}};
}

function renderDdi(focus) {
  const day = kstDay(offset), b = ddiSel, fb = ddiFortune(b, day), sv = SERVER[day.iso]?.ddi?.[b], f = sv ? ddiFrom(sv, fb) : fb;
  ensure(day);
  const items = ANIMAL.map((a, i) => ({top: JIH[i], sub: a, aria: `${a}띠`}));
  view.innerHTML = `<section class="hero band"><div class="wrap">
    ${wheel(items, b, [JIH[b], `${ANIMAL[b]}띠`], '띠 고르기')}
    <div>${dayChips(day)}
      <h1 class="name">${ANIMAL[b]}띠<small>${JI[b]}(${JIH[b]})</small></h1>
      ${f.rel.tag ? `<span class="rel">오늘의 일진과 ${f.rel.tag}</span>` : ''}
      <p class="sum">${f.rel.text}</p>
      <div class="lucky"><span>행운의 시간<b>${f.lucky.time[0]} (${f.lucky.time[1]})</b></span><span>행운의 색<b>${f.lucky.color}</b></span><span>행운의 숫자<b>${f.lucky.num.join(', ')}</b></span><span>길한 방향<b>${f.lucky.dir}</b></span></div>
    </div>${adcol}</div></section>
  <section class="band"><div class="wrap">
    <h2 style="font-size:clamp(26px,3vw,32px);margin-bottom:6px">${ANIMAL[b]}띠 출생연도별 금전운·행운운</h2>
    <p class="note">원판에서 띠를 고르면 바뀝니다. 키보드는 방향키로 옮길 수 있어요.</p>
    <div class="cards">${f.years.map(x => `<article class="card">
      <h3>${String(x.y).slice(2)}년생 <span class="gz">${x.y} ${gzName(yearGz(x.y))}년</span></h3>
      <div class="grade"><span class="k">금전운</span>${badge(x.gm)}${dots(x.gm)}</div>
      <p>${x.money}</p>
      <div class="grade"><span class="k">행운운</span>${badge(x.gl)}${dots(x.gl)}</div>
      <p>${x.luck}</p></article>`).join('')}</div>
    ${ad}
  </div></section>`;
  bindWheel((i, kb) => { ddiSel = i; store.set('ddi', i); renderDdi(kb); });
  bindDays(() => renderDdi());
  if (focus) view.querySelector('.seg.on')?.focus();
}

function renderStars(focus) {
  const day = kstDay(offset), i = starSel, f = starOf(i, day), s = STARS[i];
  ensure(day);
  const items = STARS.map(x => ({top: x[0], aria: `${x[0]}자리 ${x[1]}`}));
  const all = STARS.map((x, j) => ({j, f: j === i ? f : starOf(j, day)})).sort((a, b) => b.f.total - a.f.total || a.j - b.j);
  view.innerHTML = `<section class="hero band"><div class="wrap">
    ${wheel(items, i, [s[0], s[1]], '별자리 고르기')}
    <div>${dayChips(day)}
      <h1 class="name">${s[0]}자리<small>${s[1]}</small></h1>
      <span class="rel">${s[2]}의 별자리 · 금전·행운 ${all.findIndex(a => a.j === i) + 1}위</span>
      <p class="sum">${f.text}</p>
      <div class="lucky"><span>행운의 시간<b>${f.lucky.time[0]} (${f.lucky.time[1]})</b></span><span>행운의 색<b>${f.lucky.color}</b></span><span>행운의 숫자<b>${f.lucky.num}</b></span><span>행운의 물건<b>${f.lucky.item}</b></span></div>
    </div>${adcol}</div></section>
  <section class="band"><div class="wrap split">
    <div><h2 style="font-size:clamp(26px,3vw,32px);margin-bottom:14px">${s[0]}자리 금전운·행운운</h2>
      <div class="meters">${CATS.map(([k, n], j) => `<div class="meter${j < 2 ? ' big' : ''}"><div class="lab">${n}<span>${GRADE[f.sc[j]]} · ${f.sc[j]}/5</span></div>
        <div class="track"><i style="width:${f.sc[j] * 20}%"></i></div><p>${f.lines[j]}</p></div>`).join('')}</div></div>
    <div><h2 style="font-size:clamp(26px,3vw,32px);margin-bottom:6px">오늘의 금전·행운 순위</h2>
      <p class="note">금전운과 행운운 점수를 더한 순서입니다 (10점 만점).</p>
      <ol class="rank">${all.map((a, n) => `<li><button data-star="${a.j}" class="${a.j === i ? 'on' : ''}"><span class="n">${n + 1}</span><span>${STARS[a.j][0]}자리</span><span class="bar"><i style="width:${a.f.total * 10}%"></i></span><span class="sc">${a.f.total}점</span></button></li>`).join('')}</ol>
    </div></div>
    <div class="wrap">${ad}</div></section>`;
  const go = (j, kb) => { starSel = j; store.set('star', j); renderStars(kb); };
  bindWheel(go);
  view.querySelectorAll('[data-star]').forEach(bt => bt.onclick = () => { go(+bt.dataset.star, false); window.scrollTo({top: 0, behavior: 'smooth'}); });
  bindDays(() => renderStars());
  if (focus) view.querySelector('.seg.on')?.focus();
}

function renderBirth() {
  view.innerHTML = `<section class="hero band"><div class="wrap" style="grid-template-columns:minmax(0,1fr)"><div class="soon">
    <h1 class="name">생년월일 운세</h1>
    <p class="sum">태어난 연·월·일로 사주의 일간을 뽑아 오늘의 일진과 맞춰 보는 운세를 준비하고 있습니다. 그동안 띠별 운세와 별자리 운세를 먼저 확인해 보세요.</p>
    <div class="days" style="margin-top:18px"><a class="day" href="#ddi" style="text-decoration:none;display:flex;align-items:center">띠별 운세 보기</a><a class="day" href="#stars" style="text-decoration:none;display:flex;align-items:center">별자리 운세 보기</a></div>
  </div></div></section>`;
}

function route() {
  const h = location.hash.replace('#', '') || 'ddi';
  const tab = ['ddi', 'stars', 'birth'].includes(h) ? h : 'ddi';
  document.querySelectorAll('[data-tab]').forEach(a => { a.classList.toggle('on', a.dataset.tab === tab); a.setAttribute('aria-current', a.dataset.tab === tab ? 'page' : 'false'); });
  if (tab === 'stars') renderStars(); else if (tab === 'birth') renderBirth(); else renderDdi();
}
window.addEventListener('hashchange', () => { route(); window.scrollTo(0, 0); });
route();
}
</script>
</body>
</html>
