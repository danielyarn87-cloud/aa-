# 분석한 경기의 배당 갱신 (GitHub Actions, 무료). 저장소에는 아무것도 쓰지 않는다.
# 매시 17분: 1시간마다 배당 / 매시 47분: 곧(15~50분 뒤) 시작하는 경기의 마지막 배당.
# 실제 일은 사이트의 functions/api/odds/[[path]].js 가 하고, 결과는 Cloudflare KV 에 쌓인다.
# 여러 번 불려도 사이트 쪽에서 간격을 지키므로 배당 API 크레딧을 더 쓰지 않는다.
name: 배당 갱신

on:
  # 예약 실행은 Cloudflare Worker 'raise-clock'(tools/clock-worker.js)이 정확한 시각에 workflow_dispatch 로 시작시킨다.
  # GitHub 의 schedule 은 10~50분씩 늦고, 같이 두면 두 번 돌아 Claude 비용이 두 배가 되므로 뺐다.
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 배당 갱신 요청
        env:
          SITE: ${{ vars.SITE_URL || 'https://aa-2kp.pages.dev' }}
        run: |
          curl -fsS -X POST "$SITE/api/odds/refresh" -H "Content-Type: application/json" --max-time 120 || echo "갱신 실패 (다음 번에 다시 시도)"
