# 로또 당첨번호 (GitHub Actions, 무료). 동행복권에서 새 회차 당첨번호를 받아 data/lotto/draws.json 에 쌓는다.
# 처음엔 1회부터 채우고(동행복권이 느려지면 다음 실행에서 이어서), 그다음부터는 토요일 추첨 뒤 새 회차만.
# Claude 를 부르지 않아 비용 없음. 저장되면 Cloudflare Pages 가 raise-lotto.com (/lotto/) 을 다시 만든다.
name: 로또 당첨번호

on:
  schedule:
    # 1시간마다 37분. 새 회차가 없으면 동행복권에 한 번만 묻고 끝난다 (저장·재배포 없음).
    # 동행복권이 한 번에 많이 물으면 느려져서, 처음 1회부터 채우는 동안은 여러 번에 나눠 이어 받는다.
    - cron: "37 * * * *"
  workflow_dispatch:         # 원할 때: Actions 탭 → 로또 당첨번호 → Run workflow

permissions:
  contents: write

concurrency:
  group: lotto
  cancel-in-progress: false

jobs:
  lotto:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 당첨번호 받기
        id: run
        run: python -m lotto

      - name: 바뀌었으면 저장
        if: steps.run.outputs.changed == 'true'
        run: |
          git config user.name "aa-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lotto/draws.json
          if git diff --cached --quiet; then echo "새 회차 없음"; exit 0; fi
          git commit -m "로또 당첨번호 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1
