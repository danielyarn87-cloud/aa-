# 기준점 적용 (Claude 비용 없음)
# 운영자 사이트에서 언더/오버 기준점(2.5·3.5·4.5)을 바꾸면 data/lines.json 이 저장되고 이 작업이 돈다.
# 분석가들이 미리 답해 둔 세 기준점 숫자로 분석 결과(reports)와 채점 기록(ledger)을 고친 뒤 저장한다.
# 저장되면 Cloudflare Pages 가 사이트(회원·운영자)를 다시 만들고, 끝나면 '쇼츠 만들기'가 그 경기 쇼츠를 다시 만든다.
name: 기준점 적용

on:
  push:
    branches: [main]
    paths: ["data/lines.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily          # '매일 분석'과 같은 줄: 동시에 같은 기록 파일을 고치지 않게
  cancel-in-progress: false

jobs:
  reline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 설치
        run: pip install -r requirements.txt

      - name: 기준점 반영
        run: python -m aa reline

      - name: 바뀌었으면 저장
        run: |
          git config user.name "aa-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports data/ledger.sqlite
          if git diff --cached --quiet; then echo "바뀐 기록 없음"; exit 0; fi
          git commit -m "기준점 적용 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git stash -u -q || true
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1
