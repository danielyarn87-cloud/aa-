# 스포츠 뉴스 (GitHub Actions, 무료). 3시간마다 다가오는 경기 팀의 감독·부상·이적·징계 소식을 모은다.
# 구글 뉴스 RSS(무료)에서 제목을 받고, 새 제목만 Claude Haiku 가 골라 한 줄로 요약한다 → data/news.json
# 비용은 한 달 약 700원~2천 원 (추정). 저장되면 Cloudflare Pages 가 사이트를 다시 만들어 뉴스 탭에 반영한다.
# 분석할 때 관련 뉴스가 분석가에게도 전달된다 (aa/pipeline.py).
name: 스포츠 뉴스

on:
  schedule:
    - cron: "41 */3 * * *"   # 3시간마다 41분 (한국 시각 0:41, 3:41, 6:41 …)
  workflow_dispatch:          # 원할 때: Actions 탭 → 스포츠 뉴스 → Run workflow

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 설치
        run: pip install -r requirements.txt

      - name: 뉴스 모으기
        id: run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m aa news

      - name: 바뀌었으면 저장
        run: |
          git config user.name "aa-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/claude_spend.json 2>/dev/null || git add data/news.json
          if git diff --cached --quiet; then echo "바뀐 뉴스 없음"; exit 0; fi
          # 보이는 뉴스가 그대로면(이미 본 기사 기록만 바뀜) Cloudflare 재배포를 건너뛴다
          SKIP=""; [ "${{ steps.run.outputs.changed }}" = "true" ] || SKIP=" [CF-Pages-Skip]"
          git commit -m "스포츠 뉴스 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')$SKIP"
          git stash -u -q || true
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1
