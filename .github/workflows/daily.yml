# 매일 자동 분석 (GitHub Actions, 무료)
# 순서: 테스트 → 끝난 경기 채점 → 예정 경기 수집 → (사이트에서 고른 경기만) 분석 → 기록 저장(main)
# Cloudflare Pages 가 main 을 보고 있다가 새 기록이 올라오면 사이트를 다시 만든다.
# 사이트의 '분석 요청' 화면도 이 작업을 실행한다 (functions/api/run.js).
# API 키는 저장소 Settings → Secrets and variables → Actions 에 넣는다 (코드에 쓰지 않음).
name: 매일 분석

on:
  schedule:
    - cron: "3 21 * * *"    # 매일 06:03 (한국 시각, UTC 로는 전날 21:03)
    - cron: "3 5 * * *"     # 매일 14:03 (한국 시각)
  workflow_dispatch:         # 원할 때 분석: Actions 탭 → 매일 분석 → "Run workflow" (휴대폰 GitHub 앱에서도 가능)
    inputs:
      leagues:
        description: "리그 번호, 쉼표로 (비우면 기본 리그). 39 EPL, 140 라리가, 135 세리에A, 78 분데스, 61 리그1, 2 챔스, 3 유로파, 848 컨퍼런스, 40 챔피언십, 88 에레디비시, 94 포르투갈, 203 튀르키예, 144 벨기에, 179 스코틀랜드, 292 K리그1, 293 K리그2, 98 J1, 99 J2, 253 MLS"
        required: false
        default: ""
      days:
        description: "오늘부터 며칠 뒤 경기까지 수집 (비우면 2)"
        required: false
        default: ""
      within:
        description: "킥오프 몇 시간 안의 경기를 분석 (비우면 48)"
        required: false
        default: ""
      max:
        description: "이번에 분석할 최대 경기 수 (비우면 하루 한도 10)"
        required: false
        default: ""
      ids:
        description: "이 경기들만 분석 (경기 번호, 쉼표로. 비우면 6시·14시처럼 경기 목록만 모음)"
        required: false
        default: ""
      light:
        description: "호출 절약 (순위표만 쓰고 부상자·상대 전적·직전 경기 생략)"
        type: boolean
        default: false
      reanalyze:
        description: "이미 분석한 경기도 기간 안이면 다시 분석"
        type: boolean
        default: false
      mock:
        description: "모의 실행 (Claude API 비용 없이 흐름만 확인)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 설치
        run: pip install -r requirements.txt pytest

      - name: 테스트
        run: python -m pytest -q

      - name: 채점 → 수집 → 분석
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          IN_LEAGUES: ${{ inputs.leagues }}
          IN_DAYS: ${{ inputs.days }}
          IN_WITHIN: ${{ inputs.within }}
          IN_MAX: ${{ inputs.max }}
          IN_MOCK: ${{ inputs.mock }}
          IN_LIGHT: ${{ inputs.light }}
          IN_REANALYZE: ${{ inputs.reanalyze }}
          IN_IDS: ${{ inputs.ids }}
        run: |
          ARGS=()
          [ -n "$IN_LEAGUES" ] && ARGS+=(--leagues "$IN_LEAGUES")
          [ -n "$IN_DAYS" ] && ARGS+=(--days "$IN_DAYS")
          [ -n "$IN_WITHIN" ] && ARGS+=(--within "$IN_WITHIN")
          [ -n "$IN_MAX" ] && ARGS+=(--max "$IN_MAX")
          [ "$IN_MOCK" = "true" ] && ARGS+=(--mock)
          [ "$IN_LIGHT" = "true" ] && ARGS+=(--light)
          [ "$IN_REANALYZE" = "true" ] && ARGS+=(--reanalyze)
          [ -n "$IN_IDS" ] && ARGS+=(--ids "$IN_IDS")
          python -m aa daily "${ARGS[@]}"

      - name: 기록 저장 (예측·결과·API 캐시)
        run: |
          git config user.name "aa-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data reports
          if git diff --cached --quiet; then
            echo "바뀐 기록 없음"
          else
            git commit -m "자동 분석 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            git pull --rebase origin main   # 실행 중에 기본 리그 저장 등 다른 커밋이 올라왔을 수 있음
            git push
          fi

      - name: 사이트 만들기 확인 (실제 배포는 Cloudflare Pages 가 main 에서)
        run: python tools/export_static.py dist/site
