# 쇼츠 만들기: '매일 분석'·'기준점 적용'이 끝나면 자동으로 돈다 (Actions 탭에서 바로 돌릴 수도 있음).
# 고른 리그(data/shorts.json)의 분석 끝난 예정 경기를 세로 영상으로 만들어 'shorts' 브랜치에 올린다.
# 운영자 사이트 '쇼츠' 화면(functions/api/shorts)이 여기서 받아 간다. Claude 비용 없음.
name: 쇼츠 만들기

on:
  workflow_run:
    workflows: ["매일 분석", "기준점 적용"]   # 기준점이 바뀌면 그 경기 쇼츠도 다시 (요약이 바뀌면 파일 이름이 바뀜)
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shorts
  cancel-in-progress: false

jobs:
  shorts:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 설치 (한글 글꼴·ffmpeg·Pillow)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk ffmpeg >/dev/null
          pip install -q pyyaml pillow

      - name: 지난 쇼츠 가져오기 (분석이 그대로인 경기는 다시 만들지 않음)
        run: |
          mkdir -p /tmp/shorts
          if git fetch -q --depth 1 origin shorts; then git archive FETCH_HEAD | tar -x -C /tmp/shorts; fi
          ls /tmp/shorts | wc -l

      - name: 쇼츠 만들기
        run: python tools/make_shorts_batch.py /tmp/shorts

      - name: shorts 브랜치에 올리기 (기록 1개만 유지)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd /tmp/shorts
          git init -q -b shorts
          git add -A
          git -c user.name="aa-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "쇼츠 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" shorts
